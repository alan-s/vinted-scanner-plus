# Set file paths and names to load for search and filter configs. Also set the csv file name to store state
#
# 'file': the various config types. Do NOT change this!
#   base_path: (optional) the parent path where all config are located. If no value is supplied, then current working dir is used
#   directory_name: the name of the directory where the file is located
#   file_name: search_config.yaml

configs:
  - config: search_config
    base_path:
    directory_name: config
    file_name: search_config.yaml

  - config: state
    base_path:
    directory_name: state
    file_name: already_notified_items.csv

  - config: item_filters
    base_path:
    directory_name: filters
    file_name: item_filters.yaml

  - config: seller_filters
    base_path:
    directory_name: filters
    file_name: seller_filters.yaml

  - config: notification_config
    base_path:
    directory_name: config
    file_name: notification_config.yaml
