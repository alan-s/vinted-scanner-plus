# Vinted platform urls and queries to search
#
# 'vinted_url': change the TLD according to your country (.fr, .es, etc.)
# 'vinted_api_url': url of the api for the same country TLD
# 'locale': marketplace locale e.g. en-GB, it-IT, etc.
vinted:
  vinted_url: https://www.vinted.co.uk
  vinted_api_url: https://api.vinted.co.uk
  locale:

# 'pages': number of pages to scan for each request. Note, Vinted returns a maximum of 96 items per page
# 'max_items': maximum number of items to process (and potentially notify) for each search query
search:
  pages: 2
  max_items: 5

# Vinted queries for search
# 'search_text' is the free search field, this field may be empty if you wish to search for the entire brand.
# 'attribute_ids[catalog]' is the category in which to eventually search, if the field is empty it will search in all categories. Vinted assigns a numeric ID to each category, e.g. 2996 is the ID for e-Book Reader
# 'attribute_ids[brand]' if you want to search by brand. Vinted assigns a numeric ID to each brand, e.g. 417 is the ID for Louis Vuitton
# 'order' you can change it to relevance, newest_first, price_high_to_low, price_low_to_high
queries:
- query_id: sheriff_board_game
  search_text: Sheriff
  attribute_ids[catalog]: 4881
  attribute_ids[brand]: 1317890
  price_from: 4
  price_to: 16
  order: relevance
  per_page: 96
