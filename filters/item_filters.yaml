# Define optional filters on item attributes for each Vinted query. Used to include or exclude items from the final result set
#
# 'query_id': same as query_id from search_config.yaml
# 'mode': [include,exclude] include: all rules must match for the item to be included. exclude: a match against any rule excludes the item
# 'rules': 
#   - 'key': key to filter (additionally accepts nested keys using "." e.g. user.verification.email)
#   - 'operator': available operators for the comparison
#     - [equals,contains] string operators: normalised case-insensitive exact or substring match
#     - [equals,greater_than,greater_than_or_equal,less_than,less_than_or_equal,between] numeric operators
#     - [exists,is_null,is_empty] 'nothing' operators: whether the key exists, or explictly equals NULL, or whether it is empty
#   - 'word_match' : [true,false] default string operator 'contains' is partial matching. Add optional 'word_match: true' for full word matching)
#   - 'value': the value to use in the comparison operator (can accept csv list of values)
filters:
  - query_id: monopoly_stranger_things
    mode: exclude
    rules:
      - key: title
        operator: contains
        word_match: true
        value: cluedo