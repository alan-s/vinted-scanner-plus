name: Vinted Scanner Plus Job Template

on:
  workflow_call:
    inputs:
      args:
        required: false
        type: string
        default: ""
      log_path:
        required: true
        type: string

      CONFIGS:
        required: true
        type: string
      SEARCH_CONFIG:
        required: true
        type: string
      ITEM_FILTERS:
        required: true
        type: string
      SELLER_FILTERS:
        required: true
        type: string

    secrets:
      NOTIFICATION_CONFIG:
        required: true

permissions:
  contents: write

concurrency:
  group: vinted-scanner-plus-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrieve latest seen items CSV
        run: |
          git fetch origin main
          git checkout origin/main -- state/already_notified_items.csv || true

      - name: Load config and filter yaml from input vars
        env:
          CONFIGS: ${{ inputs.CONFIGS }}
          SEARCH_CONFIG: ${{ inputs.SEARCH_CONFIG }}
          NOTIFICATION_CONFIG: ${{ secrets.NOTIFICATION_CONFIG }}
          ITEM_FILTERS: ${{ inputs.ITEM_FILTERS }}
          SELLER_FILTERS: ${{ inputs.SELLER_FILTERS }}
        run: |
          # Create directories if they don't exist
          mkdir -p configs filters state

          # Create config files
          printf '%s' "$CONFIGS" > configs/configs.yaml
          printf '%s' "$SEARCH_CONFIG" > configs/search_config.yaml
          printf '%s' "$NOTIFICATION_CONFIG" > configs/notification_config.yaml

          # Create filter files
          printf '%s' "$ITEM_FILTERS" > filters/item_filters.yaml
          printf '%s' "$SELLER_FILTERS" > filters/seller_filters.yaml

      - name: Set environment variable for log path
        env:
          INPUT_LOG_PATH: ${{ inputs.log_path }}
        run: |
          echo "LOG_PATH=$INPUT_LOG_PATH" >> "$GITHUB_ENV"

      - name: Resolve and set environment variable for state file path
        env:
          RAW_CONFIGS: ${{ inputs.CONFIGS }}
        run: |
          python3 -c '
          import os, yaml
          from utils.file_utils import build_file_path

          configs = yaml.safe_load(os.environ.get("RAW_CONFIGS", "")) or {}
          file_cfg = configs.get("file_configs") or {}
          state_cfg = file_cfg.get("state_config") or {}

          resolved_path = build_file_path(
              filename=state_cfg["file_name"],
              directory_name=state_cfg.get("directory_name"),
              base_path=state_cfg.get("base_path")
          )

          # Export to $GITHUB_ENV so it is available as $STATE_FILE_PATH in later steps
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"STATE_FILE_PATH={resolved_path}\n")
          '

      - name: Run scanner
        env:
          SCANNER_ARGS: ${{ inputs.args }}
        run: |
          python3 -c '
          import os
          import shlex
          import subprocess

          args = shlex.split(os.environ.get("SCANNER_ARGS", ""))
          log_path = os.environ["LOG_PATH"]

          subprocess.run(
              ["python3", "vinted_scanner_plus.py", *args, "--log-path", log_path],
              check=True
          )'

      - name: Commit updated seen items
        if: ${{ hashFiles(env.STATE_FILE_PATH) != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$STATE_FILE_PATH"

          # Commit and push only if changes exist
          if git diff --cached --quiet; then
            echo "No new items to commit."
          else
            git commit -m "Update seen/notified items."
            git push origin HEAD:main
          fi

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f "$LOG_PATH" ]; then
            echo "Log file not found: $LOG_PATH"
            exit 1
          fi

          git add "$LOG_PATH"

          if git diff --cached --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "Update logs."
            git push origin HEAD:main
          fi
