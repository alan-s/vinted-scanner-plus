name: Vinted Scanner Plus Template

on:
  workflow_call:
    inputs:
      CONFIGS:
        description: 'General configuration'
        required: true
        type: string
      SEARCH_CONFIG:
        description: 'Search configuration'
        required: true
        type: string
      ITEM_FILTERS:
        description: 'Item filters'
        required: true
        type: string
      SELLER_FILTERS:
        description: 'Seller filters'
        required: true
        type: string

    secrets:
      NOTIFICATION_CONFIG:
        required: true

permissions:
  contents: write

concurrency:
  group: vinted-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Config, Filters and State files
        env:
          CONFIGS: ${{ inputs.CONFIGS }}
          SEARCH_CONFIG: ${{ inputs.SEARCH_CONFIG }}
          NOTIFICATION_CONFIG: ${{ secrets.NOTIFICATION_CONFIG }}
          ITEM_FILTERS: ${{ inputs.ITEM_FILTERS }}
          SELLER_FILTERS: ${{ inputs.SELLER_FILTERS }}
        run: |
          # Create directories if they don't exist
          mkdir -p config filters state

          # Create config files
          printf '%s' "$CONFIGS" > config/configs.yaml
          printf '%s' "$SEARCH_CONFIG" > config/search_config.yaml
          printf '%s' "$NOTIFICATION_CONFIG" > config/notification_config.yaml

          # Create filter files
          printf '%s' "$ITEM_FILTERS" > filters/item_filters.yaml
          printf '%s' "$SELLER_FILTERS" > filters/seller_filters.yaml

      - name: Commit updated seen items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retrieve the latest CSV from GitHub
          git fetch origin main
          git checkout origin/main -- state/already_notified_items.csv || true

          # Stage the updated CSV
          git add state/already_notified_items.csv

          # Commit and push only if changes exist
          if git diff --cached --quiet; then
            echo "No new items to commit."
          else
            git commit -m "Update Vinted seen items."
            git push origin HEAD:main
          fi

      - name: Run scanner
        run: python3 vinted_scanner.py             

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp vinted_scanner.log /tmp/vinted_scanner_new.log

          git fetch origin main
          git checkout origin/main -- vinted_scanner.log || touch vinted_scanner.log

          cat vinted_scanner.log /tmp/vinted_scanner_new.log > vinted_scanner_merged.log
          mv vinted_scanner_merged.log vinted_scanner.log

          git add vinted_scanner.log

          if git diff --cached --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "Update Vinted logs."
            git push origin HEAD:main
          fi