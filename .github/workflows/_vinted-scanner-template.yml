name: Vinted Scanner Template

on:
  workflow_call:
    secrets:
      vinted_config:
        required: true

permissions:
  contents: write

concurrency:
  group: vinted-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Config, Filters and State files
        run: |
          # Create directories if they don't exist
          mkdir -p config filters state

          # Create config files (overwrite if they already exist)
          cat > config/configs.yaml <<'CONFIGS'
          ${{ vars.CONFIGS }}
          CONFIGS

          cat > config/search_config.yaml <<'SEARCH_CONFIG'
          ${{ secrets.SEARCH_CONFIG }}
          SEARCH_CONFIG

          cat > config/notification_config.yaml <<'NOTIFICATION_CONFIG'
          ${{ secrets.NOTIFICATION_CONFIG }}
          NOTIFICATION_CONFIG

          # Create filter files (overwrite if they already exist)
          cat > filters/item_filters.yaml <<'ITEM_FILTERS'
          ${{ secrets.ITEM_FILTERS }}
          ITEM_FILTERS

          cat > filters/seller_filters.yaml <<'SELLER_FILTERS'
          ${{ secrets.SELLER_FILTERS }}
          SELLER_FILTERS

      - name: Run scanner
        run: python3 vinted_scanner.py

      - name: Commit updated seen items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          cp already_notified_items.txt /tmp/already_notified_items_new.txt
      
          git fetch origin main
          git checkout origin/main -- already_notified_items.txt || touch already_notified_items.txt
      
          cat already_notified_items.txt /tmp/already_notified_items_new.txt | sort -u > already_notified_items_merged.txt
          mv already_notified_items_merged.txt already_notified_items.txt
      
          git add already_notified_items.txt
      
          if git diff --cached --quiet; then
            echo "No new items to commit."
          else
            git commit -m "Update Vinted seen items."
            git push origin HEAD:main
          fi

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          cp vinted_scanner.log /tmp/vinted_scanner_new.log
      
          git fetch origin main
          git checkout origin/main -- vinted_scanner.log || touch vinted_scanner.log
      
          cat vinted_scanner.log /tmp/vinted_scanner_new.log | sort -u > vinted_scanner_merged.log
          mv vinted_scanner_merged.log vinted_scanner.log
      
          git add vinted_scanner.log
      
          if git diff --cached --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "Update Vinted logs."
            git push origin HEAD:main
          fi
