name: Vinted Scanner Template

on:
  workflow_call:
    secrets:
      vinted_config:
        required: true

permissions:
  contents: write

concurrency:
  group: vinted-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Config.py
        run: |
          cat > Config.py <<'PYCONFIG'
          ${{ secrets.vinted_config }}
          PYCONFIG

      - name: Run scanner
        run: python3 vinted_scanner.py

      - name: Commit updated seen items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          cp already_notified_items.txt /tmp/already_notified_items_new.txt
      
          git fetch origin main
          git checkout origin/main -- already_notified_items.txt || touch already_notified_items.txt
      
          cat already_notified_items.txt /tmp/already_notified_items_new.txt | sort -u > already_notified_items_merged.txt
          mv already_notified_items_merged.txt already_notified_items.txt
      
          git add already_notified_items.txt
      
          if git diff --cached --quiet; then
            echo "No new items to commit."
          else
            git commit -m "Update Vinted seen items."
            git push origin HEAD:main
          fi

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          cp vinted_logs.txt /tmp/vinted_logs_new.txt
      
          git fetch origin main
          git checkout origin/main -- vinted_logs.txt || touch vinted_logs.txt
      
          cat vinted_logs.txt /tmp/vinted_logs_new.txt | sort -u > vinted_logs_merged.txt
          mv vinted_logs_merged.txt vinted_logs.txt
      
          git add vinted_logs.txt
      
          if git diff --cached --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "Update Vinted logs."
            git push origin HEAD:main
          fi
