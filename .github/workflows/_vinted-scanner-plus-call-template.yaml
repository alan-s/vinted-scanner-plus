name: Vinted Scanner Plus Call Template

on:
  workflow_call:
    inputs:
      args:
        required: false
        type: string
        default: ""

      CONFIGS:
        required: true
        type: string
      SEARCH_CONFIG:
        required: true
        type: string
      ITEM_FILTERS:
        required: true
        type: string
      SELLER_FILTERS:
        required: true
        type: string

    secrets:
      NOTIFICATION_CONFIG:
        required: true

permissions:
  contents: write

concurrency:
  group: vinted-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load config and filter yaml from input vars
        env:
          CONFIGS: ${{ inputs.CONFIGS }}
          SEARCH_CONFIG: ${{ inputs.SEARCH_CONFIG }}
          NOTIFICATION_CONFIG: ${{ secrets.NOTIFICATION_CONFIG }}
          ITEM_FILTERS: ${{ inputs.ITEM_FILTERS }}
          SELLER_FILTERS: ${{ inputs.SELLER_FILTERS }}
        run: |
          # Create directories if they don't exist
          mkdir -p configs filters state

          # Create config files
          printf '%s' "$CONFIGS" > configs/configs.yaml
          printf '%s' "$SEARCH_CONFIG" > configs/search_config.yaml
          printf '%s' "$NOTIFICATION_CONFIG" > configs/notification_config.yaml

          # Create filter files
          printf '%s' "$ITEM_FILTERS" > filters/item_filters.yaml
          printf '%s' "$SELLER_FILTERS" > filters/seller_filters.yaml

      - name: Run scanner
        env:
          SCANNER_ARGS: ${{ inputs.args }}
        run: |
          python3 -c '
          import os
          import shlex
          import subprocess

          args = shlex.split(os.environ.get("SCANNER_ARGS", ""))
          subprocess.run(
              ["python3", "vinted_scanner_plus.py", *args],
              check=True
          )'

      - name: Get state file path
        id: config
        run: |
          FILE_PATH=$(python3 -c '

          import managers.config_manager as config_manager

          config_file_path = "configs/configs.yaml"
          config_yaml = config_manager.load_configs_file_with_paths(config_file_path)
          state_file_path = config_yaml["file_configs"]["state_config"]["file_path"]

          print(state_file_path)
          ')

          echo "State file: $FILE_PATH"
          echo "file_path=$FILE_PATH" >> "$GITHUB_OUTPUT"

        - name: Commit updated seen items
        if: ${{ steps.config.outputs.file_path != '' && hashFiles(steps.config.outputs.file_path) != '' }}
        env:
          FILE_PATH: ${{ steps.config.outputs.file_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- "$FILE_PATH"

          if git diff --cached --quiet; then
            echo "No changes to state file."
          else
            git commit -m "Update seen items."
            git push origin HEAD:main
          fi

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add vinted_scanner_plus.log

          if git diff --cached --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "Update logs."
            git push origin HEAD:main
          fi
