name: Vinted Scanner Plus Call Template

on:
  workflow_call:
    inputs:
      args:
        required: false
        type: string
        default: ""

      CONFIGS:
        required: true
        type: string
      SEARCH_CONFIG:
        required: true
        type: string
      ITEM_FILTERS:
        required: true
        type: string
      SELLER_FILTERS:
        required: true
        type: string

    secrets:
      NOTIFICATION_CONFIG:
        required: true

permissions:
  contents: write

concurrency:
  group: vinted-scanner-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load config and filters
        env:
          CONFIGS: ${{ inputs.CONFIGS }}
          SEARCH_CONFIG: ${{ inputs.SEARCH_CONFIG }}
          NOTIFICATION_CONFIG: ${{ secrets.NOTIFICATION_CONFIG }}
          ITEM_FILTERS: ${{ inputs.ITEM_FILTERS }}
          SELLER_FILTERS: ${{ inputs.SELLER_FILTERS }}
        run: |
          # Create directories if they don't exist
          mkdir -p config filters state

          # Create config files
          printf '%s' "$CONFIGS" > config/configs.yaml
          printf '%s' "$SEARCH_CONFIG" > config/search_config.yaml
          printf '%s' "$NOTIFICATION_CONFIG" > config/notification_config.yaml

          # Create filter files
          printf '%s' "$ITEM_FILTERS" > filters/item_filters.yaml
          printf '%s' "$SELLER_FILTERS" > filters/seller_filters.yaml

      - name: Run scanner
        env:
          SCANNER_ARGS: ${{ inputs.args }}
        run: |
          python3 -c '
          import os
          import shlex
          import subprocess

          args = shlex.split(os.environ.get("SCANNER_ARGS", ""))
          subprocess.run(
              ["python3", "vinted_scanner.py", *args],
              check=True
          )'

      - name: Commit updated seen items
        if: ${{ hashFiles('state/already_notified_items.csv') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retrieve the latest CSV from GitHub
          git fetch origin main
          git checkout origin/main -- state/already_notified_items.csv || true

          # Stage the updated CSV
          git add state/already_notified_items.csv

          # Commit and push only if changes exist
          if git diff --cached --quiet; then
            echo "No new items to commit."
          else
            git commit -m "Update Vinted seen items."
            git push origin HEAD:main
          fi

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add vinted_scanner.log

          if git diff --cached --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "Update Vinted logs."
            git push origin HEAD:main
          fi
